<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#efe8da">
  <title>Grid Conquest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="app">
    <section id="homePage" class="page active home-page">
      <div class="shell home-shell">
        <div class="hero-stage">
          <img class="hero-img" src="/assets/home.png" alt="Grid Conquest">
          <div class="hero-overlay">
            <label class="field name-field">
              <span>NAME</span>
              <input id="playerName" maxlength="12" autocomplete="nickname" placeholder="NAME">
            </label>
            <button id="fightBtn" class="fight-btn" type="button" aria-label="Fight">
              <img src="/assets/fight.png" alt="Fight">
            </button>
          </div>
        </div>
      </div>
    </section>

    <section id="lobbyPage" class="page lobby-page">
      <div class="shell">
        <header class="bar topbar">
          <button class="text-btn back-btn" data-go="homePage" aria-label="Back">←</button>
          <strong id="lobbyName" class="player-name"></strong>
        </header>

        <div class="section-head">
          <h1>CLASS</h1>
        </div>

        <div id="classGrid" class="class-grid">
          <button class="class-card" data-job="warrior">
            <span class="class-art"><img src="/assets/warrior.png" alt="Warrior"></span>
            <b>WARRIOR</b>
            <small>LOCK ×2</small>
          </button>
          <button class="class-card" data-job="mage">
            <span class="class-art"><img src="/assets/mage.png" alt="Mage"></span>
            <b>MAGE</b>
            <small>LINE +1 ×1</small>
          </button>
          <button class="class-card" data-job="archer">
            <span class="class-art"><img src="/assets/archer.png" alt="Archer"></span>
            <b>ARCHER</b>
            <small>3rd → ×2</small>
          </button>
          <button class="class-card" data-job="priest">
            <span class="class-art"><img src="/assets/priest.png" alt="Priest"></span>
            <b>PRIEST</b>
            <small>CENTER = 5</small>
          </button>
        </div>

        <div class="lobby-actions">
          <div class="create-box card-panel">
            <h2>HOST</h2>
            <div class="row">
              <label class="field compact">
                <span>PLAYERS</span>
                <select id="maxPlayers">
                  <option value="2">2P</option>
                  <option value="3">3P</option>
                </select>
              </label>
              <label class="field compact">
                <span>LEVEL</span>
                <select id="difficulty">
                  <option value="basic">BASIC</option>
                  <option value="advanced">ADV</option>
                  <option value="challenge">±</option>
                </select>
              </label>
            </div>
            <button id="createRoomBtn" class="primary wide" type="button">CREATE</button>
          </div>

          <div class="rooms-box card-panel">
            <div class="section-title">
              <h2>ROOMS</h2>
              <button id="refreshRoomsBtn" class="text-btn" type="button" aria-label="Refresh">↻</button>
            </div>
            <div id="roomList" class="room-list"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="gamePage" class="page game-page">
      <div class="shell game-shell">
        <header class="game-head">
          <div>
            <strong id="roundText">WAIT</strong>
            <small id="difficultyText"></small>
          </div>
          <div id="timer" class="timer">60</div>
        </header>

        <div id="playersBar" class="players-bar"></div>

        <div id="waitingPanel" class="panel waiting-panel">
          <h2 id="roomTitle">ROOM</h2>
          <p id="waitingText">0/2</p>
          <button id="startBtn" class="primary hidden" type="button">START</button>
        </div>

        <div id="battlePanel" class="battle hidden">
          <div id="questionBox" class="question-box">
            <div id="questionText" class="question">--</div>
            <form id="answerForm" class="answer-row">
              <input id="answerInput" inputmode="numeric" autocomplete="off" placeholder="?">
              <button class="primary" type="submit">OK</button>
            </form>
            <div id="answerState" class="answer-state">READY</div>
          </div>

          <div class="board-wrap">
            <div id="board" class="board" aria-label="3乘3搶地盤棋盤"></div>
            <div class="board-note">□ 1　■ 2</div>
          </div>
        </div>

        <div id="resultPanel" class="panel result-panel hidden">
          <img class="winner-img" src="/assets/winner.png" alt="Winner">
          <div id="resultList"></div>
          <button id="backLobbyBtn" class="primary" type="button">LOBBY</button>
        </div>

        <div id="toast" class="toast" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
