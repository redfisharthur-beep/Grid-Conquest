<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#efe8da">
  <title>Grid Conquest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="app">
    <section id="homePage" class="page active home-page">
      <div class="shell home-shell">
        <div class="hero-stage">
          <img class="hero-img" src="/assets/home.png" alt="Grid Conquest">
          <div class="hero-overlay">
            <label class="field name-field">
              <input id="playerName" maxlength="12" autocomplete="nickname" placeholder="">
            </label>
            <button id="fightBtn" class="fight-btn" type="button" aria-label="Fight">
              <img src="/assets/fight.png" alt="Fight">
            </button>
          </div>
        </div>
      </div>
    </section>

    <section id="lobbyPage" class="page lobby-page">
      <div class="shell">
        <header class="bar topbar">
          <button class="back-btn" data-go="homePage" aria-label="返回">返回</button>
        </header>
<div id="classGrid" class="class-grid">
          <button class="class-card" data-job="warrior">
            <span class="class-art"><img src="/assets/warrior.png" alt="Warrior"></span>
            <small>前2次答對<br>佔領格鎖定</small>
          </button>
          <button class="class-card" data-job="mage">
            <span class="class-art"><img src="/assets/mage.png" alt="Mage"></span>
            <small>連線吃子<br>再隨機 +1 格（1 次）</small>
          </button>
          <button class="class-card" data-job="archer">
            <span class="class-art"><img src="/assets/archer.png" alt="Archer"></span>
            <small>第3次答對<br>一次佔2格</small>
          </button>
          <button class="class-card" data-job="priest">
            <span class="class-art"><img src="/assets/priest.png" alt="Priest"></span>
            <small>中央格 = 5分</small>
          </button>
        </div>

        <div class="lobby-actions">
          <div class="create-box card-panel">
            <div class="row"><label class="field compact">
                <select id="difficulty">
                  <option value="basic">基本</option>
                  <option value="advanced">進階</option>
                  <option value="challenge">挑戰</option>
                </select>
              </label>
            </div>
            <button id="createRoomBtn" class="primary wide" type="button">建立房間</button>
            <button id="trainingRoomBtn" class="training-btn wide" type="button">訓練房間</button>
          </div>

          <div class="rooms-box card-panel">
            <div id="roomList" class="room-list"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="gamePage" class="page game-page">
      <div class="shell game-shell">
        <header class="game-head">
          <div>
            <strong id="roundText">等待</strong>
            <small id="difficultyText"></small>
          </div>
          <div id="timer" class="timer">60</div>
        </header>

        <div id="playersBar" class="players-bar"></div>

        <div id="waitingPanel" class="panel waiting-panel">
          <h2 id="roomTitle">房間</h2>
          <p id="waitingText">0/3</p>
          <button id="startBtn" class="primary hidden" type="button">開始</button>
        </div>

        <div id="battlePanel" class="battle hidden">
          <div id="questionBox" class="question-box">
            <div id="questionText" class="question">--</div>
            <form id="answerForm" class="answer-row">
              <input id="answerInput" inputmode="numeric" autocomplete="off" placeholder="?">
              <button class="primary" type="submit">送出</button>
            </form>
            <div id="answerState" class="answer-state">作答</div>
          </div>

          <div class="board-wrap">
            <div id="board" class="board" aria-label="3乘3搶地盤棋盤"></div>
            <div class="board-note">□ 1　■ 2</div>
          </div>
        </div>

        <div id="resultPanel" class="panel result-panel hidden">
          <img class="winner-img" src="/assets/winner.png" alt="Winner">
          <div id="resultList"></div>
          <button id="backLobbyBtn" class="primary" type="button">回大廳</button>
        </div>

        <div id="toast" class="toast" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
